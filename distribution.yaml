# assistantOS as a Hermes profile distribution: `hermes profile install github.com/iGallina/assistantOS`.
# Only distribution-owned files are copied into the profile (this file, SOUL.md, mcp.json, skills/, cron/); the Python
# core, the Windows installer and docs/ stay in the repo. The owner's data goes to the profile's local/ (never updated).
name: assistantos
