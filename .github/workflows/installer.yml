name: installer
on:
  push:
    paths: ["install/**", ".github/workflows/installer.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build assistantOS-Setup.exe (Inno Setup 6, preinstalled on the runner)
        shell: pwsh
        run: |
          $ref = if ("${{ github.ref_type }}" -eq "tag") { "" } else { "${{ github.ref_name }}" }   # tags = releases
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DRef=$ref" install\assistantOS.iss
          Get-Item dist\assistantOS-Setup.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: assistantOS-Setup
          path: dist/assistantOS-Setup.exe
  install:
    # The real thing on a Windows runner: the built .exe, silent, then check what a customer would get.
    # Not a pristine PC (the runner already has git and uv), so those two steps take their "already there" path.
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assistantOS-Setup
      - name: Install silently
        shell: pwsh
        run: |
          $p = Start-Process .\assistantOS-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/LOG=setup.log' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\assistantOS\install.log" -ErrorAction SilentlyContinue | Select-String ' == '
          if ($p.ExitCode -ne 0) { Get-Content setup.log -Tail 30; throw "setup exit $($p.ExitCode)" }
      - name: Check what the customer gets
        shell: pwsh
        run: |
          $core = "$env:LOCALAPPDATA\assistantOS\core"
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Paseo\Paseo.exe")) { throw 'Paseo missing' }
          if (-not (Test-Path "$core\.venv")) { throw 'assistantOS not set up' }
          if ((git -C $core remote) -ne 'upstream') { throw 'remote is not upstream' }
          Get-ScheduledTask -TaskName assistantOS, assistantOS-pagina | Format-Table TaskName, State
          $ok = $false
          foreach ($i in 1..30) { try { $r = Invoke-WebRequest http://127.0.0.1:8422/ -TimeoutSec 5; $ok = $r.StatusCode -eq 200; break } catch { Start-Sleep 2 } }
          if (-not $ok) { throw 'page not answering on 127.0.0.1:8422' }
          if (-not (Test-Path ([Environment]::GetFolderPath('Desktop') + '\assistantOS.url'))) { throw 'desktop shortcut missing' }
          'installed: Paseo, assistantOS, scheduled pass, page 200, desktop shortcut'
