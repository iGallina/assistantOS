[project]
name = "assistantos"
version = "0.2.0"
description = "Personal AI assistant for owner-operators"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.12",
    "mcp>=1.10",
    "pydantic>=2.9",
    "tzdata>=2026.4",
]

[project.scripts]
aos = "assistantos.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
